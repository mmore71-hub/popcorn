<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Popcorn">
<title>Popcorn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">
<style>
:root{
  --bg:#0f1115;--bg2:#171a21;--bg3:#1f232c;--line:#2a2f3a;
  --tx:#eef0f4;--tx2:#a3a9b6;--tx3:#6b7280;
  --ac:#4f8cff;--ac2:#2f6fe8;--ok:#22c55e;--warn:#f59e0b;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}

/* header */
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.bar{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.logo{font-weight:700;font-size:17px;white-space:nowrap;letter-spacing:-.2px}
.logo{display:flex;align-items:center;gap:8px}
.logo img{width:40px;height:40px;border-radius:10px}
.logo .lt{font-size:19px}
.search{flex:1;position:relative}
@media(max-width:480px){.logo .lt{display:none}}
.search input{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:10px 38px 10px 40px;color:var(--tx);font-size:15px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--ac)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;display:none;place-items:center;color:var(--tx2)}
.search.has .clr{display:grid}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);border:1px solid var(--line);flex-shrink:0}
.iconbtn:hover{border-color:var(--tx3)}

main{max-width:1100px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
h2{font-size:18px;margin:6px 0 12px;letter-spacing:-.2px}
.muted{color:var(--tx2)}
.small{font-size:13px}

/* tabs / chips */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:14px;color:var(--tx2)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.card{display:block;border-radius:var(--r);overflow:hidden;background:var(--bg2);border:1px solid var(--line);transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--tx3)}
.poster{aspect-ratio:2/3;background:var(--bg3) center/cover no-repeat;position:relative}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:12px;padding:10px;text-align:center}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.minis{position:absolute;bottom:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.minis img{width:24px;height:24px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.card .meta{padding:9px 10px 11px}
.card .t{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .y{font-size:12px;color:var(--tx3);margin-top:2px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--bg2) 0,var(--bg3) 50%,var(--bg2) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* panels */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.cta{display:inline-block;margin-top:10px;background:var(--ac);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600}
.cta:hover{background:var(--ac2)}

/* detail */
.hero{position:relative;margin:-16px -16px 0;min-height:200px;background:var(--bg2) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,17,21,.3),var(--bg) 95%)}
.dwrap{position:relative;z-index:1;display:flex;gap:18px;margin-top:-110px;align-items:flex-end}
.dwrap .poster{width:120px;flex-shrink:0;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
@media(min-width:700px){.dwrap .poster{width:170px}.hero{min-height:300px}.dwrap{margin-top:-160px}}
.dtitle{font-size:24px;font-weight:700;line-height:1.15;letter-spacing:-.4px}
@media(min-width:700px){.dtitle{font-size:32px}}
.dsub{color:var(--tx2);margin-top:6px;font-size:14px}
.overview{margin:18px 0;color:#d3d7df;max-width:760px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);margin-bottom:10px;position:relative;z-index:2}
.sec{margin-top:20px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx2);margin-bottom:10px;font-weight:600}
.provs{display:flex;flex-wrap:wrap;gap:10px}
.prov{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:7px 12px 7px 7px}
.prov img{width:38px;height:38px;border-radius:9px}
a.prov{cursor:pointer;transition:border-color .12s,transform .12s,background .12s}
a.prov:hover{border-color:var(--tx3);transform:translateY(-1px)}
a.prov:active{transform:scale(.97)}
.prov .go{color:var(--tx3);font-size:13px;margin-left:2px}
.prov.mine .go{color:var(--ok)}
.prov .n{font-size:14px;font-weight:500}
.prov.mine{border-color:var(--ok);background:rgba(34,197,94,.08)}
.prov.mine .n::after{content:" ✓";color:var(--ok)}
.yes{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);color:#86efac;padding:10px 14px;border-radius:12px;font-weight:600;display:inline-block}
.no{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fcd34d;padding:10px 14px;border-radius:12px;display:inline-block}

/* settings */
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1;min-width:200px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none;font-family:ui-monospace,Menlo,monospace}
.field input:focus{border-color:var(--ac)}
.btn{background:var(--bg3);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.status{margin-top:8px;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--bg3);border:1.5px solid transparent;text-align:left;transition:border-color .12s,background .12s}
.pitem img{width:36px;height:36px;border-radius:8px;flex-shrink:0}
.pitem .n{font-size:13px;line-height:1.2;flex:1}
.pitem .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tx3);flex-shrink:0;display:grid;place-items:center;font-size:12px}
.pitem.on{border-color:var(--ac);background:rgba(79,140,255,.1)}
.pitem.on .ck{background:var(--ac);border-color:var(--ac);color:#fff}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---- home ---- */
.featwrap{position:relative;margin:-16px -16px 6px}
.feat{position:relative;display:block;min-height:420px;background:var(--bg2) center 20%/cover no-repeat;animation:fade .6s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.feat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(15,17,21,.82) 32%,rgba(15,17,21,.15) 72%,rgba(15,17,21,.35) 100%),linear-gradient(to right,rgba(15,17,21,.75),transparent 65%)}
.feat-in{position:absolute;z-index:1;left:20px;right:20px;bottom:26px;max-width:580px}
.feat-tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#ffd166;font-weight:700}
.feat-t{font-size:30px;font-weight:800;line-height:1.08;margin:6px 0 6px;letter-spacing:-.6px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.feat-m{color:#c9ced8;font-size:14px}
.feat-o{margin-top:10px;color:#d8dce4;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat-p{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:30px}
.feat-p img{width:30px;height:30px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.feat-b{display:inline-block;margin-top:14px;background:#fff;color:#0f1115;padding:10px 20px;border-radius:10px;font-weight:700;font-size:15px;transition:transform .12s}
.feat:hover .feat-b{transform:scale(1.03)}
.dots{position:absolute;z-index:2;right:20px;bottom:30px;display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.35);transition:all .25s}
.dots button.on{width:22px;background:#fff}
@media(min-width:700px){
  .featwrap{margin:0 0 6px}
  .feat{min-height:470px;border-radius:20px;overflow:hidden}
  .feat::after{border-radius:20px}
  .feat-in{left:36px;bottom:36px}
  .feat-t{font-size:46px}
  .feat-o{font-size:15px}
  .dots{right:30px;bottom:38px}
}
@media(max-width:699px){.dots{top:calc(14px);bottom:auto;right:16px}}
.greet h1{font-size:21px;letter-spacing:-.3px;margin:14px 0 12px}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 4px;padding:2px 16px 6px}
.pchips::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);white-space:nowrap;font-size:14px;flex-shrink:0;transition:all .15s}
.pchip.all{padding:5px 14px}
.pchip img{width:26px;height:26px;border-radius:7px}
.pchip.on{border-color:var(--ac);background:rgba(79,140,255,.16);color:#fff}
.hrow{margin:20px 0 6px}
.hrow-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hrow h2{margin:0;font-size:18px}
.arrows{display:none;gap:6px;flex-shrink:0}
@media(hover:hover) and (min-width:700px){.arrows{display:flex}}
.arrows button{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);font-size:20px;line-height:1;display:grid;place-items:center}
.arrows button:hover{border-color:var(--tx3)}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px;scroll-padding:0 16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .card{flex:0 0 132px;scroll-snap-align:start}
@media(min-width:700px){.scroller .card{flex-basis:165px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:#1f2937;border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;transition:all .35s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.in{transform:translate(-50%,0);opacity:1}
.btn[disabled]{opacity:.5;cursor:default}
.heart{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:rgba(255,255,255,.85);font-size:17px;line-height:1;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:transform .15s,background .15s,color .15s;z-index:2}
.heart:hover{transform:scale(1.1)}
.heart.on{background:#ff3b5c;color:#fff}
.likebtn{margin-top:12px;display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-weight:600;font-size:14px;transition:all .15s}
.likebtn .h{color:var(--tx3);font-size:16px}
.likebtn.on{background:rgba(255,59,92,.15);border-color:#ff3b5c}
.likebtn.on .h{color:#ff3b5c}
.panel.tip{border-color:rgba(255,59,92,.35);background:linear-gradient(135deg,rgba(255,59,92,.08),var(--bg2))}
#row-foryou h2::before{content:"✨ "}
.scroller.people .pcard{flex:0 0 112px;scroll-snap-align:start}
.pcard{display:block;text-align:center}
.pcard .ph{width:96px;height:96px;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--bg3);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:26px;color:var(--tx3);transition:border-color .15s,transform .15s}
.pcard:hover .ph{border-color:var(--ac);transform:scale(1.04)}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .pn{font-weight:600;font-size:14px;margin-top:8px;line-height:1.2}
.pcard .pk{font-size:12px;color:var(--tx3);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.person{display:flex;gap:20px;align-items:flex-start;margin-top:6px}
.pphoto{width:120px;aspect-ratio:2/3;flex-shrink:0;border-radius:14px;overflow:hidden;background:var(--bg3);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.pphoto img{width:100%;height:100%;object-fit:cover}
@media(min-width:700px){.pphoto{width:180px}}
.bio{margin-top:12px;color:#d3d7df;font-size:14px;max-width:760px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.bio.open{display:block}
.more{color:var(--ac);font-weight:600;font-size:14px;margin-top:6px}
.card .y{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tonight{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:0 0 6px;border-radius:16px;background:linear-gradient(120deg,rgba(255,209,102,.16),rgba(230,57,70,.16));border:1px solid rgba(255,209,102,.3);transition:transform .15s,border-color .15s}
.tonight:hover{transform:translateY(-1px);border-color:rgba(255,209,102,.6)}
.tonight .dice{font-size:30px}
.tonight b{font-size:16px}
.tonight .arr{margin-left:auto;font-size:26px;color:var(--tx2)}
.tn-h{font-size:24px;letter-spacing:-.4px;margin:4px 0 14px}
.tn-moods{margin-bottom:8px}
@media(max-width:699px){.tn-moods,.tn-durs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.tn-moods::-webkit-scrollbar,.tn-durs::-webkit-scrollbar{display:none}.tn-moods .chip,.tn-durs .chip{white-space:nowrap;flex-shrink:0}}
.pick{position:relative;border-radius:20px;overflow:hidden;min-height:440px;background:var(--bg2) center 25%/cover no-repeat;margin-top:6px;animation:fade .5s ease}
.pick::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,17,21,.97) 8%,rgba(15,17,21,.75) 45%,rgba(15,17,21,.15) 85%)}
.pick-in{position:absolute;z-index:1;left:20px;right:20px;bottom:22px;max-width:640px}
.pick-why{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#ffd166}
.pick-t{font-size:30px;font-weight:800;line-height:1.08;margin:6px 0;letter-spacing:-.6px}
.pick-m{color:#c9ced8;font-size:14px}
.pick-tag{font-style:italic;color:#e7e9ee;margin-top:8px;font-size:14px}
.pick-o{margin-top:8px;color:#d8dce4;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pick-p{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pick-p .prov{padding:5px 10px 5px 5px}.pick-p .prov img{width:30px;height:30px}
.pick-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn.big{padding:11px 18px;font-size:15px;border-radius:12px;display:inline-flex;align-items:center;gap:6px}
@media(min-width:700px){.pick{min-height:500px}.pick-in{left:36px;bottom:34px}.pick-t{font-size:44px}}
footer{max-width:1100px;margin:0 auto;padding:0 16px 30px;color:var(--tx3);font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer img{height:12px}
.empty{padding:40px 0;text-align:center;color:var(--tx2)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a href="#/" class="logo"><img src="icon.svg" alt=""><span class="lt">Popcorn</span></a>
    <div class="search" id="sbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cerca un film, una serie o un attore…" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" aria-label="Cancella">✕</button>
    </div>
    <a href="#/impostazioni" class="iconbtn" title="Impostazioni" aria-label="Impostazioni">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </a>
  </div>
</header>

<main id="app"></main>

<footer>
  <span>Dati di disponibilità forniti da <a href="https://www.justwatch.com/it" target="_blank" rel="noopener"><b>JustWatch</b></a>.</span>
  <span>Questo prodotto usa l'API di TMDB ma non è approvato né certificato da TMDB.</span>
</footer>

<script>
"use strict";
/* ================= config & storage ================= */
const API = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/";
const REGION = "IT";
const TTL = { short: 6 * 3600e3, long: 7 * 24 * 3600e3 };

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { cacheClear(); try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } }
};
const state = {
  key: LS.get("tmdbKey", ""),
  subs: new Set(LS.get("subs", [])),
  homeProv: LS.get("homeProv", null),
  likes: LS.get("likes", []),        // [{k:"movie:123", title, at}]
  history: LS.get("history", []),    // titoli aperti di recente
  nope: LS.get("nope", []),          // titoli scartati con "Non fa per me"
  providers: null
};
const saveSubs = () => LS.set("subs", [...state.subs]);

/* ================= cache ================= */
const mem = new Map();
function cacheGet(k) {
  if (mem.has(k)) { const e = mem.get(k); if (e.x > Date.now()) return e.v; }
  const e = LS.get("c:" + k, null);
  if (e && e.x > Date.now()) { mem.set(k, e); return e.v; }
  return undefined;
}
function cacheSet(k, v, ttl) {
  const e = { v, x: Date.now() + ttl };
  mem.set(k, e);
  try { localStorage.setItem("c:" + k, JSON.stringify(e)); }
  catch { cacheClear(); }
}
function cacheClear() {
  try { Object.keys(localStorage).filter(k => k.startsWith("c:")).forEach(k => localStorage.removeItem(k)); } catch {}
}

/* ================= TMDB client ================= */
async function tmdb(path, params = {}, { ttl = TTL.short, signal } = {}) {
  if (!state.key) throw new Error("NOKEY");
  const u = new URL(API + path);
  u.searchParams.set("language", "it-IT");
  for (const [k, v] of Object.entries(params)) if (v !== undefined && v !== "") u.searchParams.set(k, v);
  const ck = u.pathname.replace("/3", "") + u.search;
  const hit = ttl ? cacheGet(ck) : undefined;
  if (hit !== undefined) return hit;

  const isToken = state.key.startsWith("eyJ");      // v4 Read Access Token
  if (!isToken) u.searchParams.set("api_key", state.key);
  const r = await fetch(u, { signal, headers: isToken ? { Authorization: "Bearer " + state.key, accept: "application/json" } : { accept: "application/json" } });
  if (r.status === 401) throw new Error("BADKEY");
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (ttl) cacheSet(ck, j, ttl);
  return j;
}

const isLiked = k => state.likes.some(l => l.k === k);
function toggleLike(k, title) {
  if (isLiked(k)) { state.likes = state.likes.filter(l => l.k !== k); toast("Rimosso dai preferiti"); }
  else { state.likes.unshift({ k, title, at: Date.now() }); state.likes = state.likes.slice(0, 60); toast("❤️ Aggiunto: lo userò per i tuoi consigli"); }
  LS.set("likes", state.likes);
  document.querySelectorAll(`[data-like="${k}"]`).forEach(b => b.classList.toggle("on", isLiked(k)));
}
function addHistory(k, title) {

  LS.set("history", state.history);
}

/* Consigli: unisce le "recommendations" di TMDB dei titoli che ti piacciono (peso 3) e di quelli aperti di recente (peso 1) */
async function recommendFor(seeds, signal, limit = 20) {
  const exclude = new Set([...state.likes.map(l => l.k), ...seeds.map(s => s.k)]);
  const score = new Map();
  const lists = await Promise.all(seeds.map(s => {
    const [t, id] = s.k.split(":");
    return tmdb(`/${t}/${id}/recommendations`, {}, { signal, ttl: 24 * 3600e3 }).then(j => ({ s, res: j.results || [] })).catch(() => ({ s, res: [] }));
  }));
  for (const { s, res } of lists) res.forEach((r, i) => {
    if (r.media_type !== "movie" && r.media_type !== "tv") return;
    const k = r.media_type + ":" + r.id; if (exclude.has(k) || !r.poster_path) return;
    const e = score.get(k) || { r, v: 0 };
    e.v += s.w * (1 - i / 40) + (r.vote_average || 0) / 50;
    score.set(k, e);
  });
  let cand = [...score.values()].sort((a, b) => b.v - a.v).slice(0, 40);
  if (state.subs.size) {                     // prima quello che puoi vedere con i tuoi abbonamenti
    await Promise.all(cand.map(async c => { try { c.mine = (await myProviders(c.r.media_type, c.r.id)).length > 0; } catch { c.mine = false; } }));
    cand.sort((a, b) => (b.mine - a.mine) || (b.v - a.v));
  }
  return cand.slice(0, limit).map(c => c.r);
}
function tasteSeeds() {
  const seen = new Set(), out = [];
  for (const l of state.likes.slice(0, 8)) if (!seen.has(l.k)) { seen.add(l.k); out.push({ ...l, w: 3 }); }
  for (const h of state.history.slice(0, 6)) if (!seen.has(h.k)) { seen.add(h.k); out.push({ ...h, w: 1 }); }
  return out;
}

/* Shows logos of the user's subscriptions on each card — loaded lazily when the card becomes visible */
let io = null;
function decorateCards(root) {
  if (!state.subs.size || !root) return;
  io = io || new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { io.unobserve(e.target); decorateOne(e.target); }
  }), { rootMargin: "150px" });
  root.querySelectorAll(".card[data-k]:not([data-d])").forEach(c => { c.dataset.d = "1"; io.observe(c); });
}
async function myProviders(type, id) {
  const j = await tmdb(`/${type}/${id}/watch/providers`);
  const reg = j.results?.[REGION]; if (!reg) return [];
  const inc = [...(reg.flatrate || []), ...(reg.free || []), ...(reg.ads || [])].filter(p => state.subs.has(p.provider_id));
  return [...new Map(inc.map(p => [p.provider_id, p])).values()];
}
async function decorateOne(c) {
  const [t, id] = c.dataset.k.split(":");
  try {
    const mine = await myProviders(t, id);
    if (mine.length) c.querySelector(".minis").innerHTML = mine.slice(0, 5).map(p => `<img src="${img(p.logo_path, "w92")}" alt="${esc(p.provider_name)}" title="${esc(p.provider_name)}">`).join("");
  } catch {}
}

async function loadProviders() {
  if (state.providers) return state.providers;
  const [m, t] = await Promise.all([
    tmdb("/watch/providers/movie", { watch_region: REGION }, { ttl: TTL.long }),
    tmdb("/watch/providers/tv", { watch_region: REGION }, { ttl: TTL.long })
  ]);
  const map = new Map();
  for (const p of [...m.results, ...t.results]) {
    const prio = p.display_priorities?.[REGION] ?? p.display_priority ?? 999;
    const old = map.get(p.provider_id);
    if (!old || prio < old.prio) map.set(p.provider_id, { id: p.provider_id, name: p.provider_name, logo: p.logo_path, prio });
  }
  state.providers = [...map.values()].sort((a, b) => a.prio - b.prio);
  return state.providers;
}

/* accetta un link "…#/setup?k=…&s=…" oppure la sola chiave */
function parseSetup(text) {
  text = (text || "").trim(); if (!text) return null;
  const m = text.match(/#\/setup\?(.*)$/);
  if (m) {
    const prm = new URLSearchParams(m[1]);
    const key = (prm.get("k") || "").trim();
    let likes = null;
    try { if (prm.get("l")) likes = b64dec(prm.get("l")).map(([k, title]) => ({ k, title, at: Date.now() })); } catch {}
    return key ? { key, subs: (prm.get("s") || "").split(",").map(Number).filter(Boolean), likes } : null;
  }
  return /^[A-Za-z0-9._-]{20,}$/.test(text) ? { key: text, subs: null } : null;
}
/* base64 "url-safe" per il link (supporta accenti) */
function b64enc(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(str) {
  const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
function applySetup(r) {
  if (r.likes && r.likes.length) {      // unisce i preferiti dell'altro dispositivo a quelli già presenti
    const have = new Set(state.likes.map(l => l.k));
    state.likes = [...state.likes, ...r.likes.filter(l => !have.has(l.k))].slice(0, 60);
    LS.set("likes", state.likes);
  }
  state.key = r.key; LS.set("tmdbKey", r.key);
  if (r.subs) { state.subs = new Set(r.subs); saveSubs(); }
  state.providers = null; cacheClear();
}

/* ---------- ricerca tollerante agli errori di battitura ---------- */
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function sim(q, t) {                       // somiglianza 0..1 (coefficiente di Dice sui bigrammi)
  q = norm(q); t = norm(t);
  if (!q || !t) return 0;
  if (t.startsWith(q)) return 1;
  if (t.includes(q)) return 0.95;
  const bg = s => { const m = new Map(); for (let i = 0; i < s.length - 1; i++) { const g = s.slice(i, i + 2); m.set(g, (m.get(g) || 0) + 1); } return m; };
  const A = bg(q), B = bg(t.slice(0, q.length + 6));   // confronta con l'inizio del titolo
  let inter = 0; for (const [g, c] of A) inter += Math.min(c, B.get(g) || 0);
  const sum = m => [...m.values()].reduce((a, b) => a + b, 0);
  return 2 * inter / ((sum(A) + sum(B)) || 1);
}
async function searchOnce(q, signal) {
  const [m, t] = await Promise.all([
    tmdb("/search/movie", { query: q, include_adult: "false", region: REGION }, { signal }),
    tmdb("/search/tv", { query: q, include_adult: "false" }, { signal })
  ]);
  return [...m.results.map(r => ({ ...r, media_type: "movie" })), ...t.results.map(r => ({ ...r, media_type: "tv" }))];
}
function typoVariants(q) {
  const words = norm(q).split(" "), out = new Set();
  words.forEach((w, i) => {
    if (w.length < 5) return;
    const put = v => out.add([...words.slice(0, i), v, ...words.slice(i + 1)].join(" "));
    for (let k = 0; k < w.length; k++) put(w.slice(0, k) + w.slice(k + 1));                       // lettera in più
    for (let k = 0; k < w.length - 1; k++) put(w.slice(0, k) + w[k + 1] + w[k] + w.slice(k + 2));  // lettere invertite
  });
  out.delete(norm(q));
  return [...out].slice(0, 16);
}
async function smartSearch(q, signal) {
  const [base, ppl] = await Promise.all([
    searchOnce(q, signal),
    norm(q).length >= 3 ? tmdb("/search/person", { query: q, include_adult: "false" }, { signal }).then(j => j.results.map(r => ({ ...r, media_type: "person" }))).catch(() => []) : []
  ]);
  let res = [...base, ...ppl].map(r => ({ ...r, _orig: true }));
  if (base.length < 8 && ppl.length < 2) {
    const vars = typoVariants(q);
    const more = await Promise.all(vars.map(v =>
      tmdb("/search/multi", { query: v, include_adult: "false" }, { signal }).then(j => j.results).catch(() => [])));
    res = res.concat(more.flat());
  }
  const seen = new Map();
  for (const r of res) {
    if (!["movie", "tv", "person"].includes(r.media_type)) continue;
    const k = r.media_type + ":" + r.id;
    const score = Math.max(sim(q, r.title || r.name), sim(q, r.original_title || r.original_name));
    if (r.media_type === "person" ? score < 0.6 : (!r._orig && score < 0.5)) continue;
    const prev = seen.get(k);
    if (!prev || score > prev._s) seen.set(k, { ...r, _s: score });
  }
  const all = [...seen.values()].sort((a, b) => (b._s - a._s) || ((b.popularity || 0) - (a.popularity || 0)));
  return {
    titles: all.filter(r => r.media_type !== "person").slice(0, 30),
    people: all.filter(r => r.media_type === "person" && (r.profile_path || r.popularity > 2)).slice(0, 10)
  };
}

];

async function buildTonightPool(mood, dur, signal) {
  const base = { watch_region: REGION, with_watch_monetization_types: "flatrate|free|ads", "vote_average.gte": 6.4, "vote_count.gte": 250, sort_by: "popularity.desc" };
  if (state.subs.size) base.with_watch_providers = [...state.subs].join("|");
  if (mood.g) base.with_genres = mood.g;
  if (mood.no) base.without_genres = mood.no;
  if (dur) { base["with_runtime.lte"] = dur; base["with_runtime.gte"] = 60; }
  const pages = [1, 2 + Math.floor(Math.random() * 3), 5 + Math.floor(Math.random() * 5)];
  const disc = (await Promise.all(pages.map(pg => tmdb("/discover/movie", { ...base, page: pg }, { signal }).then(j => j.results).catch(() => [])))).flat()
    .map(r => ({ ...r, media_type: "movie", _w: (r.vote_average || 0) }));

  let recs = [];
  const seeds = tasteSeeds();
  if (seeds.length) {
    const want = mood.g ? mood.g.split("|").map(Number) : null, avoid = mood.no ? mood.no.split("|").map(Number) : [];
    recs = (await recommendFor(seeds, signal, 40).catch(() => []))
      .filter(r => r.media_type === "movie" && (r.vote_average || 0) >= 6 && (!want || (r.genre_ids || []).some(g => want.includes(g))) && !(r.genre_ids || []).some(g => avoid.includes(g)))
      .map(r => ({ ...r, _w: (r.vote_average || 0) + 1.5, _rec: true }));
  }
  const skip = new Set([...state.likes, ...state.history, ...(state.nope || []).map(k => ({ k }))].map(x => x.k));
  const map = new Map();
  for (const r of [...recs, ...disc]) {
    const k = "movie:" + r.id;
    if (skip.has(k) || !r.poster_path || !r.backdrop_path || map.has(k)) continue;
    map.set(k, { ...r, _w: r._w + Math.random() * 2.5 });   // un po' di casualità
  }
  return [...map.values()].sort((a, b) => b._w - a._w);
}

async function pickTonight(mood, dur, signal) {
  const key = mood.id + "|" + dur + "|" + [...state.subs].join(",");
  if (tonight.key !== key || tonight.pool.length < 3) {
    tonight.key = key;
    tonight.pool = (await buildTonightPool(mood, dur, signal)).filter(r => !tonight.shown.has(r.id));
  }
  while (tonight.pool.length) {
    // scelta casuale pesata tra i primi 8
    const top = tonight.pool.slice(0, 8), tot = top.reduce((a, r) => a + r._w, 0);
    let x = Math.random() * tot, idx = 0;
    for (; idx < top.length - 1; idx++) { x -= top[idx]._w; if (x <= 0) break; }
    const c = tonight.pool.splice(idx, 1)[0];
    tonight.shown.add(c.id);
    const d = await tmdb(`/movie/${c.id}`, { append_to_response: "watch/providers,videos", include_video_language: "it,en" }, { signal });
    if (dur && d.runtime && d.runtime > dur) continue;
    const reg = d["watch/providers"]?.results?.[REGION];
    const inc = reg ? [...(reg.flatrate || []), ...(reg.free || []), ...(reg.ads || [])] : [];
    const mine = [...new Map(inc.filter(p => !state.subs.size || state.subs.has(p.provider_id)).map(p => [p.provider_id, p])).values()];
    if (!mine.length) continue;                       // deve essere visibile senza pagare altro
    return { d, mine, reg, rec: c._rec };
  }
  return null;
}

/* link per aprire il titolo sulla piattaforma (ricerca del titolo nel servizio) */
const PROVIDER_LINKS = [
  [/netflix/i, q => `https://www.netflix.com/search?q=${q}`],
  [/prime video|amazon prime/i, q => `https://www.primevideo.com/search?phrase=${q}`],
  [/amazon video/i, q => `https://www.amazon.it/s?k=${q}&i=instant-video`],
  [/disney/i, q => `https://www.disneyplus.com/search?q=${q}`],
  [/apple tv/i, q => `https://tv.apple.com/it/search?term=${q}`],
  [/raiplay/i, q => `https://www.raiplay.it/ricerca.html?q=${q}`],
  [/google play/i, q => `https://play.google.com/store/search?q=${q}&c=movies`],
  [/youtube/i, q => `https://www.youtube.com/results?search_query=${q}`]
];
function providerLink(p, title, fallback) {
  const rule = PROVIDER_LINKS.find(([re]) => re.test(p.provider_name));
  return rule ? rule[1](encodeURIComponent(title)) : fallback;
}
function providersHTML(reg, title = "") {
  if (!reg) return `<div class="sec"><div class="no">Al momento non risulta disponibile su nessuna piattaforma in Italia.</div></div>`;
  const uniq = arr => [...new Map((arr || []).map(p => [p.provider_id, p])).values()].sort((a, b) => (a.display_priority ?? 99) - (b.display_priority ?? 99));
  const included = uniq([...(reg.flatrate || []), ...(reg.free || []), ...(reg.ads || [])]);
  const mine = included.filter(p => state.subs.has(p.provider_id));
  const others = included.filter(p => !state.subs.has(p.provider_id));
  const rent = uniq(reg.rent), buy = uniq(reg.buy);
  const pill = p => {
    const href = providerLink(p, title, reg.link);
    return `<a class="prov ${state.subs.has(p.provider_id) ? "mine" : ""}" ${href ? `href="${esc(href)}" target="_blank" rel="noopener"` : ""} title="Apri su ${esc(p.provider_name)}"><img src="${img(p.logo_path, "w92")}" alt=""><span class="n">${esc(p.provider_name)}</span><span class="go">↗</span></a>`;
  };
  const sec = (t, arr) => arr.length ? `<div class="sec"><h3>${t}</h3><div class="provs">${arr.map(pill).join("")}</div></div>` : "";

  let head = "";
  if (state.subs.size) {
    head = mine.length
      ? `<div class="sec"><div class="yes">✓ Incluso in ${mine.map(p => esc(p.provider_name)).join(", ")}</div></div>`
      : `<div class="sec"><div class="no">Non è incluso nei tuoi abbonamenti.</div></div>`;
  }
  return head
    + sec(state.subs.size ? "Nei tuoi abbonamenti" : "In abbonamento", state.subs.size ? mine : included)
    + (state.subs.size ? sec("Altre piattaforme in abbonamento", others) : "")
    + sec("Noleggio", rent)
    + sec("Acquisto", buy)
    + (reg.link ? `<p class="small muted" style="margin-top:18px"><a href="${esc(reg.link)}" target="_blank" rel="noopener"><u>Apri la pagina con i link alle piattaforme →</u></a></p>` : "");
}

async function renderProviders() {
  const box = $("#plist"); if (!box) return;
  let list;
  try { list = await loadProviders(); } catch (e) { box.innerHTML = errorBox(e); return; }
  const f = ($("#pf")?.value || "").trim().toLowerCase();
  const shown = list.filter(p => !f || p.name.toLowerCase().includes(f));
  $("#cnt").textContent = state.subs.size ? `· ${state.subs.size} selezionat${state.subs.size === 1 ? "o" : "i"}` : "";
  box.innerHTML = `<div class="pgrid">${shown.map(p => `
    <button class="pitem ${state.subs.has(p.id) ? "on" : ""}" data-id="${p.id}">
      <img loading="lazy" src="${img(p.logo, "w92")}" alt=""><span class="n">${esc(p.name)}</span><span class="ck">${state.subs.has(p.id) ? "✓" : ""}</span>
    </button>`).join("")}</div>${shown.length ? "" : `<div class="empty">Nessuna piattaforma trovata.</div>`}`;
  box.querySelectorAll(".pitem").forEach(b => b.onclick = () => {
    const id = +b.dataset.id;
    state.subs.has(id) ? state.subs.delete(id) : state.subs.add(id);
    saveSubs();
    b.classList.toggle("on"); b.querySelector(".ck").textContent = state.subs.has(id) ? "✓" : "";
    $("#cnt").textContent = state.subs.size ? `· ${state.subs.size} selezionat${state.subs.size === 1 ? "o" : "i"}` : "";
  });
}

/* ================= router & search box ================= */
const qIn = $("#q"), sbox = $("#sbox");
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.classList.add("in"), 10);
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 400); }, 3500);
}
function route() {
  stopHero();
  const h = location.hash.slice(1) || "/";
  const parts = h.split("/").filter(Boolean);
  window.scrollTo(0, 0);
  if (parts[0] && parts[0].startsWith("setup")) {          // link di configurazione da un altro dispositivo
    const r = parseSetup(location.href);
    if (r) applySetup(r);
    history.replaceState(null, "", location.pathname + "#/");   // toglie la chiave dalla barra degli indirizzi
    toast(r ? "✓ Popcorn è configurato su questo dispositivo" : "Link di configurazione non valido");
    return viewHome();
  }
  if (parts[0] === "impostazioni") return viewSettings();
  if ((parts[0] === "movie" || parts[0] === "tv") && parts[1]) return viewDetail(parts[0], parts[1]);
  if (parts[0] === "person" && parts[1]) return viewPerson(parts[1]);
  if (parts[0] === "stasera") return viewTonight();
  if (parts[0] === "cerca" && parts[1]) {
    const q = decodeURIComponent(parts[1]);
    if (qIn.value.trim() !== q) qIn.value = q;
    sbox.classList.toggle("has", !!q);
    return viewSearch(q);
  }
  qIn.value = ""; sbox.classList.remove("has");
  return viewHome();
}
let deb;
qIn.addEventListener("input", () => {
  const q = qIn.value.trim();
  sbox.classList.toggle("has", !!qIn.value);
  clearTimeout(deb);
  deb = setTimeout(() => {
    const target = q.length >= 2 ? "#/cerca/" + encodeURIComponent(q) : "#/";
    if (location.hash.startsWith("#/cerca/")) history.replaceState(null, "", target), route();
    else location.hash = target;
  }, 250);
});
qIn.addEventListener("keydown", e => { if (e.key === "Enter") qIn.blur(); });
$("#clr").onclick = () => { qIn.value = ""; sbox.classList.remove("has"); location.hash = "#/"; qIn.focus(); };
window.addEventListener("hashchange", route);
route();
</script>
